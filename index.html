<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
            color: #f8fafc; /* Tailwind slate-50 */
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            outline: none;
            height: 6px;
            border-radius: 9999px;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6; /* Blue-500 */
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            transform: scale(1.2);
        }

        input[type=range]:focus::-webkit-slider-thumb {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        /* Firefox Support */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        input[type=range]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            border: none;
        }

        /* Custom dynamic progress fill */
        .range-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .range-fill {
            position: absolute;
            height: 6px;
            background: #3b82f6;
            border-radius: 9999px;
            pointer-events: none;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0%;
        }

        /* Video Controls Transitions */
        .video-controls {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform: translateY(10px);
        }
        
        .video-container:hover .video-controls,
        .video-controls.active {
            opacity: 1;
            transform: translateY(0);
        }

        .video-container.hide-cursor {
            cursor: none;
        }

        /* Playback speed menu animation */
        .speed-menu {
            transition: all 0.2s ease;
            transform-origin: bottom right;
        }
    </style>
</head>

                <!-- Progress Bar -->

                            <div class="w-0 overflow-hidden group-hover/volume:w-24 transition-all duration-300 ease-out flex items-center opacity-0 group-hover/volume:opacity-100">
                                <div class="range-wrapper w-[80px]">
                                    <div class="range-fill bg-white" id="volume-fill" style="width: 100%;"></div>
                                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">

                        <!-- Time Display -->
                        <div class="text-xs sm:text-sm font-medium tracking-wide text-slate-200 ml-2">
                            <span id="current-time">00:00</span> <span class="text-slate-400 mx-1">/</span> <span id="duration">00:00</span>

                    </div>

                    <div class="flex items-center gap-2 sm:gap-4 relative">
                        <!-- Playback Speed -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const playerContainer = document.getElementById('video-container');
            const video = document.getElementById('video-player');
            const controls = document.getElementById('video-controls');
            const centerPlayBtn = document.getElementById('center-play-btn');
            
            // Inputs
            const urlInput = document.getElementById('video-url');
            const loadUrlBtn = document.getElementById('load-url-btn');
            const fileInput = document.getElementById('file-input');
            
            // Status Overlays
            const loadingSpinner = document.getElementById('loading-spinner');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // Controls
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');
            const bufferBar = document.getElementById('buffer-bar');
            
            const volumeSlider = document.getElementById('volume-slider');
            const volumeFill = document.getElementById('volume-fill');
            const muteBtn = document.getElementById('mute-btn');
            const volumeIcon = document.getElementById('volume-icon');
            
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            
            const speedBtn = document.getElementById('speed-btn');
            const speedMenu = document.getElementById('speed-menu');
            const speedOptions = document.querySelectorAll('.speed-option');
            const speedDisplay = document.getElementById('speed-display');
            
            const pipBtn = document.getElementById('pip-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const fullscreenIcon = document.getElementById('fullscreen-icon');

            let controlsTimeout;
            let currentBlobUrl = null;

            // Default Video to showcase the player instantly (Optional, using a standard sample)
            const defaultVideoUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
            loadVideo(defaultVideoUrl);

            function loadVideo(source) {
                hideError();
                showLoading();
                video.src = source;
                video.load();
                centerPlayBtn.style.display = 'flex';
                resetPlayerState();
            }

            // URL Loading
            loadUrlBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (url) {
                    loadVideo(url);
                }
            });
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadUrlBtn.click();
            });

            // Local File Loading
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (currentBlobUrl) {
                        URL.revokeObjectURL(currentBlobUrl); // Clean up memory
                    }
                    currentBlobUrl = URL.createObjectURL(file);
                    loadVideo(currentBlobUrl);
                    urlInput.value = ''; // Clear URL input to avoid confusion
                }
            });

            // Video Event Listeners for Loading/Errors
            video.addEventListener('canplay', () => {
                hideLoading();
            });
            
            video.addEventListener('waiting', showLoading);
            video.addEventListener('playing', hideLoading);

            video.addEventListener('error', () => {
                hideLoading();
                showError("Error loading video. The URL might be invalid, broken, or restricted.");
                centerPlayBtn.style.display = 'none';
            });

            function togglePlay() {
                if (video.readyState === 0) return; // Not loaded
                
                if (video.paused || video.ended) {
                    video.play();
                } else {
                    video.pause();
                }
            }

            function updatePlayIcon() {
                if (video.paused) {
                    playIcon.className = 'ph-fill ph-play text-2xl';
                    centerPlayBtn.style.display = 'flex'; // Show center button when paused
                    controls.classList.add('active'); // Keep controls visible when paused
                } else {
                    playIcon.className = 'ph-fill ph-pause text-2xl';
                    centerPlayBtn.style.display = 'none';
                    controls.classList.remove('active');
                    resetIdleTimer();
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);
            centerPlayBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);
            
            video.addEventListener('play', updatePlayIcon);
            video.addEventListener('pause', updatePlayIcon);

            // Progress Bar
            video.addEventListener('timeupdate', () => {
                if(!video.duration) return;
                const progressPercentage = (video.currentTime / video.duration) * 100;
                progressBar.value = progressPercentage;
                progressFill.style.width = `${progressPercentage}%`;
                currentTimeEl.textContent = formatTime(video.currentTime);
            });

            // Handle Seeking
            let isScrubbing = false;

            progressBar.addEventListener('input', (e) => {
                isScrubbing = true;
                const seekTime = (e.target.value / 100) * video.duration;
                progressFill.style.width = `${e.target.value}%`;
                currentTimeEl.textContent = formatTime(seekTime);
            });

            progressBar.addEventListener('change', (e) => {
                const seekTime = (e.target.value / 100) * video.duration;
                video.currentTime = seekTime;
                isScrubbing = false;
            });

            // Buffer Bar
            video.addEventListener('progress', () => {
                if (video.duration > 0 && video.buffered.length > 0) {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    const bufferPercentage = (bufferedEnd / video.duration) * 100;
                    bufferBar.style.width = `${bufferPercentage}%`;
                }
            });

            video.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(video.duration);
            });

            function updateVolumeIcon(volume) {
                if (volume === 0 || video.muted) {
                    volumeIcon.className = 'ph-fill ph-speaker-none text-2xl';
                } else if (volume < 0.5) {
                    volumeIcon.className = 'ph-fill ph-speaker-low text-2xl';
                } else {
                    volumeIcon.className = 'ph-fill ph-speaker-high text-2xl';
                }
            }

            volumeSlider.addEventListener('input', (e) => {
                const value = e.target.value;
                video.volume = value;
                video.muted = value === '0';
                volumeFill.style.width = `${value * 100}%`;
                updateVolumeIcon(value);
            });

            muteBtn.addEventListener('click', () => {
                if (video.muted || video.volume === 0) {
                    video.muted = false;
                    video.volume = video.volume === 0 ? 1 : video.volume;
                    volumeSlider.value = video.volume;
                    volumeFill.style.width = `${video.volume * 100}%`;
                } else {
                    video.muted = true;
                    volumeSlider.value = 0;
                    volumeFill.style.width = '0%';
                }
                updateVolumeIcon(video.volume);
            });

            // Initialize Volume UI
            video.volume = 1;
            volumeFill.style.width = '100%';

            function formatTime(seconds) {
                if(isNaN(seconds)) return "00:00";
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                
                if (h > 0) {
                    return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            // Playback Speed
            speedBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                speedMenu.classList.toggle('scale-0');
                speedMenu.classList.toggle('opacity-0');
            });

            document.addEventListener('click', (e) => {
                if (!speedBtn.contains(e.target) && !speedMenu.contains(e.target)) {
                    speedMenu.classList.add('scale-0');
                    speedMenu.classList.add('opacity-0');
                }
            });

            speedOptions.forEach(option => {
                option.addEventListener('click', () => {
                    const speed = option.dataset.speed;
                    video.playbackRate = speed;
                    
                    // Update UI
                    speedOptions.forEach(opt => {
                        opt.classList.remove('bg-blue-600/30', 'text-blue-300', 'font-bold');
                    });
                    option.classList.add('bg-blue-600/30', 'text-blue-300', 'font-bold');
                    
                    speedDisplay.textContent = speed + 'x';
                    speedMenu.classList.add('scale-0', 'opacity-0');
                });
            });

            // Picture-in-Picture
            if ('pictureInPictureEnabled' in document) {
                pipBtn.addEventListener('click', async () => {
                    try {
                        if (document.pictureInPictureElement) {
                            await document.exitPictureInPicture();
                        } else {
                            await video.requestPictureInPicture();
                        }
                    } catch (error) {
                        console.error('PiP Error:', error);
                    }
                });
            } else {
                pipBtn.style.display = 'none'; // Hide if not supported
            }

            // Fullscreen
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    if (playerContainer.requestFullscreen) {
                        playerContainer.requestFullscreen();
                    } else if (playerContainer.webkitRequestFullscreen) { /* Safari */
                        playerContainer.webkitRequestFullscreen();
                    } else if (playerContainer.msRequestFullscreen) { /* IE11 */
                        playerContainer.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) { /* Safari */
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) { /* IE11 */
                        document.msExitFullscreen();
                    }
                }
            }

            fullscreenBtn.addEventListener('click', toggleFullscreen);
            video.addEventListener('dblclick', toggleFullscreen);

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    fullscreenIcon.className = 'ph-bold ph-corners-in text-xl';
                    playerContainer.classList.remove('rounded-2xl', 'aspect-video');
                } else {
                    fullscreenIcon.className = 'ph-bold ph-corners-out text-xl';
                    playerContainer.classList.add('rounded-2xl', 'aspect-video');
                }
            });

            function resetIdleTimer() {
                clearTimeout(controlsTimeout);
                playerContainer.classList.remove('hide-cursor');
                if(!video.paused) {
                    controlsTimeout = setTimeout(() => {
                        playerContainer.classList.add('hide-cursor');
                    }, 3000);
                }
            }

            playerContainer.addEventListener('mousemove', resetIdleTimer);
            playerContainer.addEventListener('mouseleave', () => {
                if(!video.paused) playerContainer.classList.add('hide-cursor');
            });

            // Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                // Ignore shortcuts if typing in input
                if (document.activeElement === urlInput) return;

                switch(e.key.toLowerCase()) {
                    case ' ':
                    case 'k':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'f':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'm':
                        e.preventDefault();
                        muteBtn.click();
                        break;
                    case 'arrowright':
                        e.preventDefault();
                        video.currentTime = Math.min(video.currentTime + 5, video.duration);
                        break;
                    case 'arrowleft':
                        e.preventDefault();
                        video.currentTime = Math.max(video.currentTime - 5, 0);
                        break;
                }
            });

            // Helpers
            function showLoading() {
                loadingSpinner.classList.remove('hidden');
            }
            
            function hideLoading() {
                loadingSpinner.classList.add('hidden');
            }

            function showError(msg) {
                errorMessage.classList.remove('hidden');
                errorText.textContent = msg;
            }

            function hideError() {
                errorMessage.classList.add('hidden');
            }

            function resetPlayerState() {
                progressBar.value = 0;
                progressFill.style.width = '0%';
                bufferBar.style.width = '0%';
                currentTimeEl.textContent = '00:00';
                durationEl.textContent = '00:00';
                playIcon.className = 'ph-fill ph-play text-2xl';
                controls.classList.remove('active');
            }
        });
    </script>
</body>
</html>
