<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnum Clothing Bin Card</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
  }
  th, td {
    border: 2px solid black;
    padding: 12px 8px;
  }
  .header-section td {
    padding: 8px;
  }
  .logo {
    font-size: 40px;
    font-weight: 900;
    line-height: 1;
    text-align: center;
  }
  .logo span {
    font-size: 10px;
    font-weight: normal;
    display: block;
    margin-top: -5px;
  }
  .title {
    font-size: 22px;
    font-weight: bold;
  }
  .subtitle {
    font-size: 18px;
    font-weight: bold;
    margin-top: 5px;
  }
  .label {
    text-align: center;
    font-weight: bold;
    width: 12%;
  }
  .empty-cell {
    width: 21%;
  }
</style>
</head>
<body>

  <table>
    <tr class="header-section">
      <td colspan="2" class="logo">m*<span>magnum clothing</span></td>
      <td colspan="4">
        <div class="title">MAGNUM CLOTHING PVT. LTD.</div>
        <div class="subtitle">BIN CARD</div>
      </td>
    </tr>
    <tr class="header-section">
      <td class="label">Buyer</td>
      <td class="empty-cell"></td>
      <td class="label">Rack</td>
      <td class="empty-cell"></td>
      <td class="label">F-NUMBER</td>
      <td class="empty-cell"></td>
    </tr>
    <tr class="header-section">
      <td class="label">Style</td>
      <td class="empty-cell"></td>
      <td class="label">Colour</td>
      <td class="empty-cell"></td>
      <td class="label"></td>
      <td class="empty-cell"></td>
    </tr>
    <tr>
      <th>S.NO</th>
      <th>ROLL NO</th>
      <th>MTRS</th>
      <th>WIDTH</th>
      <th>SHADE NO</th>
      <th></th>
    </tr>
    <!-- Empty rows for the Bin Card -->
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>

    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>
