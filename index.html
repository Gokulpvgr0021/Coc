<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball Ultimate - Hardcore Edition</title>
    <!-- Babylon.js & GUI Library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        #hud-overlay {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(239, 68, 68, 0.8);
            padding: 6px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .hud-panel span {
            color: #f43f5e;
        }
        #download-btn {
            background: linear-gradient(135deg, #e11d48, #f43f5e);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="hud-overlay">
        <div class="hud-panel">LVL: <span id="level-val">1</span>/5 | LIVES: <span id="lives-val">3</span></div>
        <div class="hud-panel">STARS: <span id="stars-val">0</span>/<span id="max-stars-val">3</span></div>
        <button id="download-btn" onclick="triggerAppDownload()">📲 DOWNLOAD</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        function triggerAppDownload() {
            alert("App Installer Package initialized! Adding Red Ball Hardcore shortcut to your home screen.");
            const appBlob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(appBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'RedBallHardcore.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- Web Audio Retro Synthesizer Engine ---
        class SoundSystem {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            playJump() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }
            playCollect() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.setValueAtTime(900, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playHurt() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }
            playWin() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.setValueAtTime(550, this.ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(750, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
        }
        const sound = new SoundSystem();

        // --- Babylon.js 3D Hardcore Engine Setup ---
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            let currentLevel = 1;
            let lives = 3;
            let starsCollected = 0;
            let totalLevelStars = 3;
            const maxLevels = 5;

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color3(0.08, 0.05, 0.18);

                const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.3, 16, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, false);

                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 1.1;

                const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector2(-1, -2), scene);
                dirLight.position = new BABYLON.Vector3(10, 25, -10);
                dirLight.intensity = 1.0;

                // Game Arrays storing objects with explicit data for collision checks
                let platforms = []; // {mesh, minX, maxX, minY, maxY}
                let hazards = [];   // meshes
                let stars = [];     // meshes
                let goalGate = null;
                let dynamicElements = [];

                function buildLevel(lvl) {
                    // Cleanup
                    platforms.forEach(p => p.mesh.dispose());
                    hazards.forEach(h => h.dispose());
                    stars.forEach(s => s.dispose());
                    if (goalGate) goalGate.dispose();
                    platforms = []; hazards = []; stars = []; dynamicElements = [];
                    starsCollected = 0;

                    let stageLength = 35 + (lvl * 10);
                    totalLevelStars = 2 + lvl;
                    document.getElementById("max-stars-val").innerText = totalLevelStars;
                    document.getElementById("stars-val").innerText = starsCollected;
                    document.getElementById("level-val").innerText = lvl;

                    // Build platform segments with gaps
                    let curX = 0;
                    while (curX < stageLength) {
                        let platWidth = 4 + Math.random() * 3;
                        let ground = BABYLON.MeshBuilder.CreateBox("g", { width: platWidth, height: 1.2, depth: 4 }, scene);
                        let pMinX = curX;
                        let pMaxX = curX + platWidth;
                        let pY = -1;
                        ground.position = new BABYLON.Vector3((pMinX + pMaxX) / 2, pY, 0);

                        let mat = new BABYLON.StandardMaterial("gMat", scene);
                        mat.diffuseColor = new BABYLON.Color3(0.15, 0.2, 0.35);
                        ground.material = mat;

                        platforms.push({ mesh: ground, minX: pMinX, maxX: pMaxX, y: pY + 0.6 });

                        // Level spikes
                        if (lvl >= 2 && curX > 4 && Math.random() > 0.4) {
                            let spike = BABYLON.MeshBuilder.CreateCylinder("spike", { diameterTop: 0, diameterBottom: 0.8, height: 1.0, tessellation: 4 }, scene);
                            spike.position = new BABYLON.Vector3((pMinX + pMaxX) / 2, -0.1, 0);
                            let sm = new BABYLON.StandardMaterial("sMat", scene); sm.diffuseColor = new BABYLON.Color3(0.9, 0.1, 0.1);
                            spike.material = sm;
                            hazards.push(spike);
                        }

                        curX += platWidth + (1.8 + lvl * 0.6);
                    }

                    // Level specific obstacles
                    if (lvl >= 2) {
                        let blade = BABYLON.MeshBuilder.CreateDisc("blade", { radius: 1.0, tessellation: 16 }, scene);
                        blade.position = new BABYLON.Vector3(12, 1.5, 0);
                        let bm = new BABYLON.StandardMaterial("bMat", scene); bm.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                        blade.material = bm;
                        hazards.push(blade);
                        dynamicElements.push({ mesh: blade, type: "saw", originX: 12, range: 3.5, speed: 0.04 });
                    }

                    if (lvl >= 3) {
                        let laser = BABYLON.MeshBuilder.CreateBox("laser", { width: 4, height: 0.2, depth: 0.2 }, scene);
                        laser.position = new BABYLON.Vector3(22, 2, 0);
                        let lm = new BABYLON.StandardMaterial("lMat", scene); lm.emissiveColor = new BABYLON.Color3(1, 0, 0);
                        laser.material = lm;
                        hazards.push(laser);
                        dynamicElements.push({ mesh: laser, type: "rotate", speed: 0.05 });
                    }

                    if (lvl >= 4) {
                        let crusher = BABYLON.MeshBuilder.CreateBox("crusher", { width: 1.2, height: 4, depth: 3 }, scene);
                        crusher.position = new BABYLON.Vector3(32, 1, 0);
                        let cm = new BABYLON.StandardMaterial("cMat", scene); cm.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                        crusher.material = cm;
                        hazards.push(crusher);
                        dynamicElements.push({ mesh: crusher, type: "crush", originX: 32, range: 2.5, speed: 0.045 });
                    }

                    // Stars placement
                    for (let s = 0; s < totalLevelStars; s++) {
                        let star = BABYLON.MeshBuilder.CreateSphere("star" + s, { diameter: 0.8 }, scene);
                        let sX = 6 + (s * (stageLength / (totalLevelStars + 1)));
                        star.position = new BABYLON.Vector3(sX, 2 + (s % 2) * 1.5, 0);
                        let sm = new BABYLON.StandardMaterial("starMat", scene); sm.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
                        star.material = sm;
                        stars.push(star);
                    }

                    // Gate
                    goalGate = BABYLON.MeshBuilder.CreateBox("gate", { width: 1, height: 4, depth: 0.8 }, scene);
                    goalGate.position = new BABYLON.Vector3(stageLength - 2, 1.5, 0);
                    let gm = new BABYLON.StandardMaterial("gMat", scene); gm.emissiveColor = new BABYLON.Color3(0.1, 0.9, 0.2);
                    goalGate.material = gm;
                }

                // --- Red Ball Character ---
                const ball = BABYLON.MeshBuilder.CreateSphere("redBall", { diameter: 1.0 }, scene);
                ball.position = new BABYLON.Vector3(1, 3, 0);
                const ballMat = new BABYLON.StandardMaterial("bMat", scene);
                ballMat.diffuseColor = new BABYLON.Color3(0.95, 0.15, 0.15);
                ball.material = ballMat;

                // Eyes
                let eyeL = BABYLON.MeshBuilder.CreateBox("eL", { width: 0.2, height: 0.25, depth: 0.15 }, scene);
                eyeL.position = new BABYLON.Vector3(-0.2, 0.2, 0.45); eyeL.parent = ball;
                let eyeR = BABYLON.MeshBuilder.CreateBox("eR", { width: 0.2, height: 0.25, depth: 0.15 }, scene);
                eyeR.position = new BABYLON.Vector3(0.2, 0.2, 0.45); eyeR.parent = ball;
                let em = new BABYLON.StandardMaterial("em", scene); em.diffuseColor = new BABYLON.Color3(0, 0, 0);
                eyeL.material = em; eyeR.material = em;

                buildLevel(currentLevel);

                // Physics state
                let moveDir = 0;
                let velocityY = 0;
                let velocityX = 0;
                let isGrounded = false;

                // --- Touch GUI Layout ---
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                let btnLeft = BABYLON.GUI.Button.CreateSimpleButton("l", "◀");
                btnLeft.width = "75px"; btnLeft.height = "75px"; btnLeft.color = "white"; btnLeft.background = "rgba(225, 29, 72, 0.7)";
                btnLeft.cornerRadius = 37; btnLeft.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnLeft.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnLeft.left = "30px"; btnLeft.bottom = "30px";
                advancedTexture.addControl(btnLeft);

                let btnRight = BABYLON.GUI.Button.CreateSimpleButton("r", "▶");
                btnRight.width = "75px"; btnRight.height = "75px"; btnRight.color = "white"; btnRight.background = "rgba(225, 29, 72, 0.7)";
                btnRight.cornerRadius = 37; btnRight.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnRight.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnRight.left = "125px"; btnRight.bottom = "30px";
                advancedTexture.addControl(btnRight);

                let btnJump = BABYLON.GUI.Button.CreateSimpleButton("j", "JUMP");
                btnJump.width = "90px"; btnJump.height = "90px"; btnJump.color = "white"; btnJump.background = "rgba(234, 179, 8, 0.85)";
                btnJump.cornerRadius = 45; btnJump.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                btnJump.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnJump.right = "30px"; btnJump.bottom = "30px";
                advancedTexture.addControl(btnJump);

                btnLeft.onPointerDownObservable.add(() => { moveDir = -1; });
                btnLeft.onPointerUpObservable.add(() => { if (moveDir === -1) moveDir = 0; });
                btnRight.onPointerDownObservable.add(() => { moveDir = 1; });
                btnRight.onPointerUpObservable.add(() => { if (moveDir === 1) moveDir = 0; });

                btnJump.onPointerUpObservable.add(() => {
                    if (isGrounded) { velocityY = 0.25; isGrounded = false; sound.playJump(); }
                });

                // Keyboard support
                window.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowLeft" || e.key === "a") moveDir = -1;
                    if (e.key === "ArrowRight" || e.key === "d") moveDir = 1;
                    if ((e.key === " " || e.key === "ArrowUp") && isGrounded) { velocityY = 0.25; isGrounded = false; sound.playJump(); }
                });
                window.addEventListener("keyup", (e) => {
                    if ((e.key === "ArrowLeft" || e.key === "a") && moveDir === -1) moveDir = 0;
                    if ((e.key === "ArrowRight" || e.key === "d") && moveDir === 1) moveDir = 0;
                });

                // --- Game Loop ---
                scene.registerBeforeRender(() => {
                    // Momentum
                    if (moveDir !== 0) {
                        velocityX += moveDir * 0.015;
                        velocityX = Math.max(-0.15, Math.min(0.15, velocityX));
                        ball.rotation.z -= velocityX * 1.8;
                    } else {
                        velocityX *= 0.82;
                    }
                    ball.position.x += velocityX;

                    // Gravity
                    velocityY -= 0.012;
                    ball.position.y += velocityY;

                    // Moving hazards
                    let time = Date.now() * 0.003;
                    dynamicElements.forEach(item => {
                        if (item.type === "saw") {
                            item.mesh.position.x = item.originX + Math.sin(time * item.speed * 40) * item.range;
                            item.mesh.rotation.z += 0.1;
                        } else if (item.type === "rotate") {
                            item.mesh.rotation.z += item.speed;
                        } else if (item.type === "crush") {
                            item.mesh.position.x = item.originX + Math.cos(time * item.speed * 30) * item.range;
                        }
                    });

                    // Explicit platform collision logic
                    let wasGrounded = false;
                    platforms.forEach(p => {
                        if (ball.position.x >= p.minX - 0.2 && ball.position.x <= p.maxX + 0.2) {
                            if (ball.position.y <= p.y + 0.5 && ball.position.y >= p.y - 0.3 && velocityY <= 0) {
                                ball.position.y = p.y;
                                velocityY = 0;
                                wasGrounded = true;
                            }
                        }
                    });
                    isGrounded = wasGrounded;

                    // Hazards collision
                    hazards.forEach(h => {
                        if (BABYLON.Vector3.Distance(ball.position, h.position) < 1.0) {
                            respawnPlayer();
                        }
                    });

                    // Fall off stage
                    if (ball.position.y < -5) {
                        respawnPlayer();
                    }

                    // Stars collection
                    stars.forEach((star, idx) => {
                        if (star && BABYLON.Vector3.Distance(ball.position, star.position) < 1.1) {
                            star.dispose();
                            stars[idx] = null;
                            starsCollected++;
                            document.getElementById("stars-val").innerText = starsCollected;
                            sound.playCollect();
                        }
                    });

                    // Gate check
                    if (goalGate && BABYLON.Vector3.Distance(ball.position, goalGate.position) < 1.3) {
                        if (starsCollected >= totalLevelStars) {
                            sound.playWin();
                            currentLevel++;
                            if (currentLevel > maxLevels) {
                                alert("🏆 LEGENDARY! You conquered all Hardcore levels!");
                                currentLevel = 1; lives = 3;
                            } else {
                                alert("🔥 Level Cleared! Advancing to Level " + currentLevel);
                            }
                            document.getElementById("lives-val").innerText = lives;
                            buildLevel(currentLevel);
                            ball.position = new BABYLON.Vector3(1, 3, 0);
                        } else {
                            ball.position.x -= 0.4; // Blocked until all stars are gathered
                        }
                    }

                    // Camera follow
                    camera.target = new BABYLON.Vector3(ball.position.x, ball.position.y, 0);
                });

                function respawnPlayer() {
                    sound.playHurt();
                    lives--;
                    document.getElementById("lives-val").innerText = lives;
                    if (lives <= 0) {
                        alert("💀 Game Over! Restarting Campaign.");
                        lives = 3; currentLevel = 1;
                        document.getElementById("lives-val").innerText = lives;
                        buildLevel(currentLevel);
                    }
                    ball.position = new BABYLON.Vector3(1, 3, 0);
                    velocityX = 0; velocityY = 0;
                }

                return scene;
            };

            const scene = createScene();
            engine.runRenderLoop(() => { scene.render(); });
            window.addEventListener("resize", () => { engine.resize(); });
        });
    </script>
</body>
</html>
