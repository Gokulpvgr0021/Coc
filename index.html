<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball: Genesis - Ultra Edition</title>
    
    <!-- PWA Web App Manifest Configuration for Home Screen Install -->
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "Red Ball Genesis",
        "short_name": "RedBall",
        "start_url": "./index.html",
        "display": "fullscreen",
        "background_color": "#090d16",
        "theme_color": "#090d16",
        "icons": [
            {
                "src": "https://img.icons8.com/color/512/red-circle.png",
                "sizes": "512x512",
                "type": "image/png"
            }
        ]
    }'>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Babylon.js & GUI Library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        #hud-overlay {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(244, 63, 94, 0.8);
            padding: 6px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .hud-panel span {
            color: #fb7185;
        }
        #install-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            pointer-events: auto;
        }
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e1b4b 0%, #090d16 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .menu-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #f43f5e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(244, 63, 94, 0.5);
            max-width: 380px;
            width: 100%;
        }
        .menu-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.5);
        }
        .menu-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Interactive Main Menu Overlay -->
    <div id="main-menu">
        <div class="menu-card">
            <h1 style="color: #fb7185; margin-bottom: 5px; font-size: 28px;">🔴 RED BALL</h1>
            <h3 style="letter-spacing: 2px; color: #38bdf8; margin-top: 0;">GENESIS ULTRA</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 25px;">Roll, jump, and collect all stars to conquer 5 hardcore levels!</p>
            <button class="menu-btn" onclick="startGame()">PLAY GAME 🚀</button>
            <button class="menu-btn" style="background: linear-gradient(135deg, #0284c7, #0369a1);" onclick="installApp()">📲 ADD TO HOME SCREEN</button>
        </div>
    </div>

    <div id="hud-overlay" style="display: none;">
        <div class="hud-panel">LVL: <span id="level-val">1</span>/5 | LIVES: <span id="lives-val">3</span></div>
        <div class="hud-panel">STARS: <span id="stars-val">0</span>/<span id="max-stars-val">3</span></div>
        <button id="install-btn" onclick="installApp()">📥 HOME</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // PWA Installation Hook
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstallPrompt = e;
        });

        function installApp() {
            if (deferredInstallPrompt) {
                deferredInstallPrompt.prompt();
                deferredInstallPrompt.userChoice.then((choiceResult) => {
                    deferredInstallPrompt = null;
                });
            } else {
                alert("To add to home screen:\n\n📱 Android (Chrome): Tap browser menu (3 dots) ➔ 'Install app' or 'Add to Home Screen'.\n\n🍎 iPhone (Safari): Tap Share button ➔ 'Add to Home Screen'.");
            }
        }

        function startGame() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("hud-overlay").style.display = "flex";
            initGame();
        }

        // --- High-End Web Audio Synthesizer ---
        class SoundSystem {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            playJump() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playCollect() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.setValueAtTime(1000, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playHurt() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
            playWin() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.setValueAtTime(600, this.ctx.currentTime + 0.12);
                osc.frequency.setValueAtTime(900, this.ctx.currentTime + 0.24);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.45);
            }
        }
        const sound = new SoundSystem();

        // --- Main Game Engine ---
        function initGame() {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            let currentLevel = 1;
            let lives = 3;
            let starsCollected = 0;
            let totalLevelStars = 3;
            const maxLevels = 5;

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color3(0.05, 0.08, 0.18);

                const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.3, 16, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, false);

                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 1.2;

                const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector2(-1, -2), scene);
                dirLight.position = new BABYLON.Vector3(15, 30, -15);
                dirLight.intensity = 1.2;

                let platforms = [];
                let hazards = [];
                let stars = [];
                let goalGate = null;
                let dynamicElements = [];

                function buildLevel(lvl) {
                    platforms.forEach(p => p.mesh.dispose());
                    hazards.forEach(h => h.dispose());
                    stars.forEach(s => s.dispose());
                    if (goalGate) goalGate.dispose();
                    platforms = []; hazards = []; stars = []; dynamicElements = [];
                    starsCollected = 0;

                    let stageLength = 35 + (lvl * 10);
                    totalLevelStars = 2 + lvl;
                    document.getElementById("max-stars-val").innerText = totalLevelStars;
                    document.getElementById("stars-val").innerText = starsCollected;
                    document.getElementById("level-val").innerText = lvl;

                    let curX = 0;
                    while (curX < stageLength) {
                        let platWidth = 4 + Math.random() * 3.5;
                        let ground = BABYLON.MeshBuilder.CreateBox("g", { width: platWidth, height: 1.2, depth: 4 }, scene);
                        let pMinX = curX;
                        let pMaxX = curX + platWidth;
                        let pY = -1;
                        ground.position = new BABYLON.Vector3((pMinX + pMaxX) / 2, pY, 0);

                        let mat = new BABYLON.StandardMaterial("gMat", scene);
                        mat.diffuseColor = new BABYLON.Color3(0.12, 0.22, 0.4);
                        mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                        ground.material = mat;

                        platforms.push({ mesh: ground, minX: pMinX, maxX: pMaxX, y: pY + 0.6 });

                        if (lvl >= 2 && curX > 3 && Math.random() > 0.35) {
                            let spike = BABYLON.MeshBuilder.CreateCylinder("spike", { diameterTop: 0, diameterBottom: 0.8, height: 1.0, tessellation: 4 }, scene);
                            spike.position = new BABYLON.Vector3((pMinX + pMaxX) / 2, -0.1, 0);
                            let sm = new BABYLON.StandardMaterial("sMat", scene); sm.diffuseColor = new BABYLON.Color3(0.95, 0.2, 0.2);
                            spike.material = sm;
                            hazards.push(spike);
                        }

                        curX += platWidth + (1.5 + lvl * 0.5);
                    }

                    if (lvl >= 2) {
                        let blade = BABYLON.MeshBuilder.CreateDisc("blade", { radius: 1.1, tessellation: 16 }, scene);
                        blade.position = new BABYLON.Vector3(12, 1.8, 0);
                        let bm = new BABYLON.StandardMaterial("bMat", scene); bm.diffuseColor = new BABYLON.Color3(0.85, 0.85, 0.85);
                        blade.material = bm;
                        hazards.push(blade);
                        dynamicElements.push({ mesh: blade, type: "saw", originX: 12, range: 3.8, speed: 0.045 });
                    }

                    if (lvl >= 3) {
                        let laser = BABYLON.MeshBuilder.CreateBox("laser", { width: 4.5, height: 0.22, depth: 0.22 }, scene);
                        laser.position = new BABYLON.Vector3(22, 2.2, 0);
                        let lm = new BABYLON.StandardMaterial("lMat", scene); lm.emissiveColor = new BABYLON.Color3(1, 0.1, 0.1);
                        laser.material = lm;
                        hazards.push(laser);
                        dynamicElements.push({ mesh: laser, type: "rotate", speed: 0.055 });
                    }

                    if (lvl >= 4) {
                        let crusher = BABYLON.MeshBuilder.CreateBox("crusher", { width: 1.3, height: 4.5, depth: 3 }, scene);
                        crusher.position = new BABYLON.Vector3(32, 1, 0);
                        let cm = new BABYLON.StandardMaterial("cMat", scene); cm.diffuseColor = new BABYLON.Color3(0.6, 0.6, 0.6);
                        crusher.material = cm;
                        hazards.push(crusher);
                        dynamicElements.push({ mesh: crusher, type: "crush", originX: 32, range: 2.8, speed: 0.05 });
                    }

                    for (let s = 0; s < totalLevelStars; s++) {
                        let star = BABYLON.MeshBuilder.CreateSphere("star" + s, { diameter: 0.85 }, scene);
                        let sX = 6 + (s * (stageLength / (totalLevelStars + 1)));
                        star.position = new BABYLON.Vector3(sX, 2.2 + (s % 2) * 1.5, 0);
                        let sm = new BABYLON.StandardMaterial("starMat", scene); sm.emissiveColor = new BABYLON.Color3(1, 0.85, 0);
                        star.material = sm;
                        stars.push(star);
                    }

                    goalGate = BABYLON.MeshBuilder.CreateBox("gate", { width: 1, height: 4.2, depth: 0.8 }, scene);
                    goalGate.position = new BABYLON.Vector3(stageLength - 2, 1.6, 0);
                    let gm = new BABYLON.StandardMaterial("gMat", scene); gm.emissiveColor = new BABYLON.Color3(0.1, 0.95, 0.3);
                    goalGate.material = gm;
                }

                // --- Juicy Red Ball Character ---
                const ball = BABYLON.MeshBuilder.CreateSphere("redBall", { diameter: 1.0 }, scene);
                ball.position = new BABYLON.Vector3(1, 3, 0);
                const ballMat = new BABYLON.StandardMaterial("bMat", scene);
                ballMat.diffuseColor = new BABYLON.Color3(0.95, 0.15, 0.2);
                ballMat.specularColor = new BABYLON.Color3(0.6, 0.6, 0.6);
                ball.material = ballMat;

                // Eyes
                let eyeL = BABYLON.MeshBuilder.CreateBox("eL", { width: 0.2, height: 0.26, depth: 0.15 }, scene);
                eyeL.position = new BABYLON.Vector3(-0.2, 0.2, 0.45); eyeL.parent = ball;
                let eyeR = BABYLON.MeshBuilder.CreateBox("eR", { width: 0.2, height: 0.26, depth: 0.15 }, scene);
                eyeR.position = new BABYLON.Vector3(0.2, 0.2, 0.45); eyeR.parent = ball;
                let em = new BABYLON.StandardMaterial("em", scene); em.diffuseColor = new BABYLON.Color3(0, 0, 0);
                eyeL.material = em; eyeR.material = em;

                buildLevel(currentLevel);

                let moveDir = 0;
                let velocityY = 0;
                let velocityX = 0;
                let isGrounded = false;

                // --- Touch GUI Layout ---
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                let btnLeft = BABYLON.GUI.Button.CreateSimpleButton("l", "◀");
                btnLeft.width = "75px"; btnLeft.height = "75px"; btnLeft.color = "white"; btnLeft.background = "rgba(244, 63, 94, 0.75)";
                btnLeft.cornerRadius = 37; btnLeft.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnLeft.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnLeft.left = "30px"; btnLeft.bottom = "30px";
                advancedTexture.addControl(btnLeft);

                let btnRight = BABYLON.GUI.Button.CreateSimpleButton("r", "▶");
                btnRight.width = "75px"; btnRight.height = "75px"; btnRight.color = "white"; btnRight.background = "rgba(244, 63, 94, 0.75)";
                btnRight.cornerRadius = 37; btnRight.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnRight.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnRight.left = "125px"; btnRight.bottom = "30px";
                advancedTexture.addControl(btnRight);

                let btnJump = BABYLON.GUI.Button.CreateSimpleButton("j", "JUMP");
                btnJump.width = "90px"; btnJump.height = "90px"; btnJump.color = "white"; btnJump.background = "rgba(234, 179, 8, 0.9)";
                btnJump.cornerRadius = 45; btnJump.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                btnJump.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnJump.right = "30px"; btnJump.bottom = "30px";
                advancedTexture.addControl(btnJump);

                btnLeft.onPointerDownObservable.add(() => { moveDir = -1; });
                btnLeft.onPointerUpObservable.add(() => { if (moveDir === -1) moveDir = 0; });
                btnRight.onPointerDownObservable.add(() => { moveDir = 1; });
                btnRight.onPointerUpObservable.add(() => { if (moveDir === 1) moveDir = 0; });

                btnJump.onPointerUpObservable.add(() => {
                    if (isGrounded) {
                        velocityY = 0.26;
                        isGrounded = false;
                        sound.playJump();
                        // Squash & stretch juice
                        ball.scaling = new BABYLON.Vector3(0.8, 1.3, 0.8);
                    }
                });

                // Keyboard support
                window.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowLeft" || e.key === "a") moveDir = -1;
                    if (e.key === "ArrowRight" || e.key === "d") moveDir = 1;
                    if ((e.key === " " || e.key === "ArrowUp") && isGrounded) {
                        velocityY = 0.26; isGrounded = false; sound.playJump();
                        ball.scaling = new BABYLON.Vector3(0.8, 1.3, 0.8);
                    }
                });
                window.addEventListener("keyup", (e) => {
                    if ((e.key === "ArrowLeft" || e.key === "a") && moveDir === -1) moveDir = 0;
                    if ((e.key === "ArrowRight" || e.key === "d") && moveDir === 1) moveDir = 0;
                });

                // --- Game Loop ---
                scene.registerBeforeRender(() => {
                    // Smooth return to normal scale after squash/stretch
                    ball.scaling = BABYLON.Vector3.Lerp(ball.scaling, new BABYLON.Vector3(1, 1, 1), 0.15);

                    if (moveDir !== 0) {
                        velocityX += moveDir * 0.016;
                        velocityX = Math.max(-0.16, Math.min(0.16, velocityX));
                        ball.rotation.z -= velocityX * 1.8;
                    } else {
                        velocityX *= 0.82;
                    }
                    ball.position.x += velocityX;

                    velocityY -= 0.013;
                    ball.position.y += velocityY;

                    let time = Date.now() * 0.003;
                    dynamicElements.forEach(item => {
                        if (item.type === "saw") {
                            item.mesh.position.x = item.originX + Math.sin(time * item.speed * 40) * item.range;
                            item.mesh.rotation.z += 0.12;
                        } else if (item.type === "rotate") {
                            item.mesh.rotation.z += item.speed;
                        } else if (item.type === "crush") {
                            item.mesh.position.x = item.originX + Math.cos(time * item.speed * 30) * item.range;
                        }
                    });

                    let wasGrounded = false;
                    platforms.forEach(p => {
                        if (ball.position.x >= p.minX - 0.2 && ball.position.x <= p.maxX + 0.2) {
                            if (ball.position.y <= p.y + 0.5 && ball.position.y >= p.y - 0.3 && velocityY <= 0) {
                                ball.position.y = p.y;
                                if (!isGrounded && velocityY < -0.1) {
                                    // Land squeeze juice
                                    ball.scaling = new BABYLON.Vector3(1.25, 0.75, 1.25);
                                }
                                velocityY = 0;
                                wasGrounded = true;
                            }
                        }
                    });
                    isGrounded = wasGrounded;

                    hazards.forEach(h => {
                        if (BABYLON.Vector3.Distance(ball.position, h.position) < 1.0) {
                            respawnPlayer();
                        }
                    });

                    if (ball.position.y < -5) {
                        respawnPlayer();
                    }

                    stars.forEach((star, idx) => {
                        if (star && BABYLON.Vector3.Distance(ball.position, star.position) < 1.15) {
                            star.dispose();
                            stars[idx] = null;
                            starsCollected++;
                            document.getElementById("stars-val").innerText = starsCollected;
                            sound.playCollect();
                        }
                    });

                    if (goalGate && BABYLON.Vector3.Distance(ball.position, goalGate.position) < 1.3) {
                        if (starsCollected >= totalLevelStars) {
                            sound.playWin();
                            currentLevel++;
                            if (currentLevel > maxLevels) {
                                alert("🏆 LEGENDARY! You conquered all Genesis levels!");
                                currentLevel = 1; lives = 3;
                            } else {
                                alert("🔥 Level Cleared! Advancing to Level " + currentLevel);
                            }
                            document.getElementById("lives-val").innerText = lives;
                            buildLevel(currentLevel);
                            ball.position = new BABYLON.Vector3(1, 3, 0);
                        } else {
                            ball.position.x -= 0.4; // Locked until all stars collected
                        }
                    }

                    camera.target = new BABYLON.Vector3(ball.position.x, ball.position.y, 0);
                });

                function respawnPlayer() {
                    sound.playHurt();
                    lives--;
                    document.getElementById("lives-val").innerText = lives;
                    if (lives <= 0) {
                        alert("💀 Game Over! Restarting Campaign.");
                        lives = 3; currentLevel = 1;
                        document.getElementById("lives-val").innerText = lives;
                        buildLevel(currentLevel);
                    }
                    ball.position = new BABYLON.Vector3(1, 3, 0);
                    velocityX = 0; velocityY = 0;
                }

                return scene;
            };

            const scene = createScene();
            engine.runRenderLoop(() => { scene.render(); });
            window.addEventListener("resize", () => { engine.resize(); });
        }
    </script>
</body>
</html>
