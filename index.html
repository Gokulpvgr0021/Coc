<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner - High Graphics HD Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        h1 {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            height: 54vh;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 4px solid #38bdf8;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.7);
        }

        /* HD Isometric / Perspective Track */
        .track {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e1b4b 0%, #09090b 100%);
        }

        .lane-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        #line-1 { left: 33%; }
        #line-2 { left: 66%; }

        /* High-Definition 3D Player Avatar */
        #player {
            position: absolute;
            bottom: 20px;
            left: 42%;
            width: 44px;
            height: 72px;
            background: linear-gradient(135deg, #f43f5e, #be123c);
            border: 2px solid #fda4af;
            border-radius: 16px 16px 8px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.5);
            z-index: 10;
        }

        /* Perspective Scaling Obstacles */
        .obstacle {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, #475569, #1e293b);
            border: 2px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            transform-origin: bottom center;
        }

        /* HD Glassmorphism HUD Overlay */
        .hud {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: bold;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(6px);
        }

        /* Modern Touch Control Buttons */
        .touch-controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 380px;
            justify-content: center;
        }

        .control-btn {
            flex: 1;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 14px 0;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.1s;
        }

        .control-btn:active {
            transform: scale(0.94);
            background: #38bdf8;
            color: #0f172a;
        }

        /* Cinematic Game Over Screen */
        .game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
        }

        .game-over-screen h2 {
            color: #f43f5e;
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.7);
        }
        
        .btn-restart {
            background: linear-gradient(to bottom, #0ea5e9, #0284c7);
            border: 2px solid #bae6fd;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.5);
        }
        .btn-restart:hover { filter: brightness(1.1); }

        .controls-hint {
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Subway Runner HD</h1>

    <div class="game-container" id="game-container">
        <!-- HD Track Lanes -->
        <div class="track">
            <div class="lane-line" id="line-1"></div>
            <div class="lane-line" id="line-2"></div>
        </div>

        <!-- Glass HUD -->
        <div class="hud">
            <div>🚀 Score: <span id="score-val">0</span></div>
            <div>⚡ Velocity: <span id="speed-val">1.0x</span></div>
        </div>

        <!-- Player Model -->
        <div id="player">🏃‍♂️</div>

        <!-- Game Over Modal -->
        <div class="game-over-screen" id="game-over-screen">
            <h2>CRASHED!</h2>
            <p style="font-size: 16px; margin: 5px 0; color: #94a3b8;">Final Score: <span id="final-score" style="color: #38bdf8; font-weight: bold;">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <!-- On-screen Control Buttons -->
    <div class="touch-controls">
        <button class="control-btn" onclick="moveLeft()">◀ Left</button>
        <button class="control-btn" onclick="jump()">▲ Jump</button>
        <button class="control-btn" onclick="duck()">▼ Duck</button>
        <button class="control-btn" onclick="moveRight()">Right ▶</button>
    </div>

    <div class="controls-hint">
        Swipe on screen, tap buttons, or use Keyboard Arrow Keys / Spacebar
    </div>

    <script>
        const lanesPercent = [12, 43, 74];
        let currentLane = 1;
        let isJumping = false;
        let isDucking = false;
        let score = 0;
        let gameSpeed = 3.5;
        let isGameOver = false;
        let obstacles = [];

        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-val');
        const speedDisplay = document.getElementById('speed-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');

        // Swipe Handling
        let touchStartX = 0;
        let touchStartY = 0;

        container.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        container.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;

            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 25) moveRight();
                else if (diffX < -25) moveLeft();
            } else {
                if (diffY < -25) jump();
                else if (diffY > 25) duck();
            }
        }, {passive: true});

        // Keyboard Inputs
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowUp' || e.key === ' ') jump();
            if (e.key === 'ArrowDown') duck();
        });

        function moveLeft() {
            if (currentLane > 0) currentLane--;
            updatePlayerPosition();
        }

        function moveRight() {
            if (currentLane < 2) currentLane++;
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            player.style.left = lanesPercent[currentLane] + '%';
        }

        function jump() {
            if (isJumping || isDucking) return;
            isJumping = true;
            player.style.bottom = '125px';
            setTimeout(() => {
                player.style.bottom = '20px';
                isJumping = false;
            }, 350);
        }

        function duck() {
            if (isJumping || isDucking) return;
            isDucking = true;
            player.style.height = '34px';
            player.style.bottom = '20px';
            player.innerText = '🙇‍♂️';
            setTimeout(() => {
                player.style.height = '72px';
                player.innerText = '🏃‍♂️';
                isDucking = false;
            }, 450);
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const lane = Math.floor(Math.random() * 3);
            const obsElement = document.createElement('div');
            obsElement.classList.add('obstacle');
            obsElement.innerHTML = Math.random() > 0.5 ? '🚧' : '🛑';
            
            let obstacleObj = {
                element: obsElement,
                lane: lane,
                y: 0, // Starts at the top horizon line
                progress: 0.05 // Perspective scale factor
            };

            container.appendChild(obsElement);
            obstacles.push(obstacleObj);

            let nextSpawnTime = Math.random() * 1000 + 800;
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        function updateGame() {
            if (isGameOver) return;

            score += 1;
            scoreDisplay.innerText = Math.floor(score / 10);
            speedDisplay.innerText = (gameSpeed / 3.5).toFixed(1) + 'x';

            let containerHeight = container.clientHeight;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                
                // Realistic perspective scaling logic
                obs.progress += 0.012 * (gameSpeed / 3.5);
                let currentY = obs.progress * containerHeight;
                let scale = 0.3 + (obs.progress * 0.9); // Grows larger as it approaches screen

                obs.element.style.top = currentY + 'px';
                obs.element.style.left = lanesPercent[obs.lane] + '%';
                obs.element.style.transform = `scale(${scale})`;
                obs.element.style.zIndex = Math.floor(obs.progress * 100);

                // Collision detection zone at bottom screen
                if (obs.progress > 0.78 && obs.progress < 0.96 && obs.lane === currentLane) {
                    if (!isJumping) {
                        triggerGameOver();
                    }
                }

                // Remove when past screen bounds
                if (obs.progress > 1.05) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                }
            }

            gameSpeed += 0.0012;
            requestAnimationFrame(updateGame);
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreDisplay.innerText = Math.floor(score / 10);
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];
            score = 0;
            gameSpeed = 3.5;
            currentLane = 1;
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            updatePlayerPosition();
            updateGame();
            setTimeout(spawnObstacle, 800);
        }

        updatePlayerPosition();
        setTimeout(spawnObstacle, 800);
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
