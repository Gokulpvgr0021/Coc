<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Runner 3D-Style</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #f39c12;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB, #2c3e50);
            border: 4px solid #f1c40f;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* Perspective Track Styling */
        .track {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                #34495e 0px,
                #34495e 40px,
                #2c3e50 40px,
                #2c3e50 80px
            );
        }

        .lane-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: rgba(255, 255, 255, 0.3);
        }

        #divider-1 { left: 133px; }
        #divider-2 { left: 266px; }

        /* Player Character */
        #player {
            position: absolute;
            bottom: 40px;
            left: 175px; /* Middle lane starting pos */
            width: 50px;
            height: 80px;
            background: #e74c3c;
            border-radius: 25px 25px 10px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: left 0.15s ease-out, bottom 0.15s ease-out;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* Obstacles */
        .obstacle {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #95a5a6;
            border: 3px solid #7f8c8d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* HUD Overlay */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            z-index: 20;
            text-shadow: 1px 1px 2px black;
        }

        /* Game Over Screen */
        .game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
        }

        .game-over-screen h2 { color: #e74c3c; font-size: 36px; margin-bottom: 10px; }
        
        .btn-restart {
            background: #27ae60;
            border: none;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-restart:hover { background: #2ecc71; }

        .controls-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #bdc3c7;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Subway Runner</h1>

    <div class="game-container" id="game-container">
        <div class="track">
            <div class="lane-divider" id="divider-1"></div>
            <div class="lane-divider" id="divider-2"></div>
        </div>

        <div class="hud">
            <div>Score: <span id="score-val">0</span></div>
            <div>Coins: <span id="coin-val">0</span></div>
        </div>

        <div id="player">🏃‍♂️</div>

        <div class="game-over-screen" id="game-over-screen">
            <h2>WIPED OUT!</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button class="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <div class="controls-hint">
        Use <b>Left/Right Arrows</b> to change lanes | <b>Up Arrow / Space</b> to jump | <b>Down Arrow</b> to duck
    </div>

    <script>
        const lanes = [45, 175, 305]; // X coordinates for Left, Middle, Right lanes
        let currentLane = 1; // Start in middle lane
        let isJumping = false;
        let isDucking = false;
        let score = 0;
        let coins = 0;
        let gameSpeed = 4;
        let isGameOver = false;
        let obstacles = [];

        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score-val');
        const coinDisplay = document.getElementById('coin-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');

        // Handle Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            if (e.key === 'ArrowLeft' && currentLane > 0) {
                currentLane--;
            } else if (e.key === 'ArrowRight' && currentLane < 2) {
                currentLane++;
            } else if ((e.key === 'ArrowUp' || e.key === ' ') && !isJumping && !isDucking) {
                jump();
            } else if (e.key === 'ArrowDown' && !isJumping) {
                duck();
            }
            updatePlayerPosition();
        });

        function updatePlayerPosition() {
            player.style.left = lanes[currentLane] + 'px';
        }

        function jump() {
            isJumping = true;
            player.style.bottom = '140px';
            setTimeout(() => {
                player.style.bottom = '40px';
                isJumping = false;
            }, 400);
        }

        function duck() {
            isDucking = true;
            player.style.height = '40px';
            player.style.bottom = '40px';
            player.innerText = '🙇‍♂️';
            setTimeout(() => {
                player.style.height = '80px';
                player.innerText = '🏃‍♂️';
                isDucking = false;
            }, 500);
        }

        // Spawn Obstacles periodically
        function spawnObstacle() {
            if (isGameOver) return;

            const lane = Math.floor(Math.random() * 3);
            const obsElement = document.createElement('div');
            obsElement.classList.add('obstacle');
            obsElement.innerHTML = Math.random() > 0.5 ? '🚧' : '🛑';
            
            let obstacleObj = {
                element: obsElement,
                lane: lane,
                y: -60 // Start above the screen view
            };

            obsElement.style.left = lanes[lane] + 'px';
            obsElement.style.top = obstacleObj.y + 'px';
            container.appendChild(obsElement);
            obstacles.push(obstacleObj);

            // Spawn next obstacle randomly between 1.2 to 2.5 seconds
            let nextSpawnTime = Math.random() * 1300 + 1200;
            setTimeout(spawnObstacle, nextSpawnTime);
        }

        // Main Game Loop
        function updateGame() {
            if (isGameOver) return;

            // Increment Score over time
            score += 1;
            scoreDisplay.innerText = Math.floor(score / 10);

            // Move Obstacles Downwards
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += gameSpeed;
                obs.element.style.top = obs.y + 'px';

                // Collision Detection
                // Player is near bottom (around y = 480px relative to container)
                if (obs.y > 450 && obs.y < 540 && obs.lane === currentLane) {
                    if (!isJumping) {
                        triggerGameOver();
                    }
                }

                // Remove obstacle if it goes off screen
                if (obs.y > 600) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                }
            }

            // Gradually increase game speed
            gameSpeed += 0.001;

            requestAnimationFrame(updateGame);
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreDisplay.innerText = Math.floor(score / 10);
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];
            score = 0;
            gameSpeed = 4;
            currentLane = 1;
            isGameOver = false;
            gameOverScreen.style.display = 'none';
            updatePlayerPosition();
            updateGame();
            setTimeout(spawnObstacle, 1000);
        }

        // Initialize Game
        updatePlayerPosition();
        setTimeout(spawnObstacle, 1500);
        requestAnimationFrame(updateGame);
    </script>
</body>
</html>
