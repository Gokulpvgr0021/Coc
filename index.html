<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans Web Prototype</title>
    <style>
        :root {
            --wood-dark: #3b220c;
            --gold-color: #ffd700;
            --elixir-color: #da70d6;
            --ui-bg: rgba(30, 20, 10, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #386f2b; /* Grass green background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            color: white;
        }

        /* Top Resource & Info Bar */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .resource-box {
            background: var(--ui-bg);
            border: 3px solid #5a3d1c;
            border-radius: 8px;
            padding: 5px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .res-icon {
            font-size: 18px;
        }

        /* Profile & Avatar Panel (Right) */
        .profile-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--ui-bg);
            border: 3px solid #5a3d1c;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .avatar-container {
            position: relative;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #d35400;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-img {
            font-size: 32px;
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            background: #27ae60;
            border: 2px solid white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 8px;
            font-weight: bold;
        }

        .player-info h4 {
            margin: 0;
            font-size: 16px;
            color: #f1c40f;
            text-shadow: 1px 1px 2px black;
        }

        .player-info p {
            margin: 2px 0 0 0;
            font-size: 11px;
            color: #bdc3c7;
        }

        /* Main Game Arena (Isometric feel) */
        .game-board {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .village-grid {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: rotateX(25deg) rotateZ(-15deg);
        }

        .tile {
            background-color: #489b38;
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }

        .tile:hover {
            background-color: #55b241;
        }

        .building {
            font-size: 28px;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
        }

        .building-label {
            font-size: 9px;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
        }

        /* Bottom Army / Training Queue Bar */
        .bottom-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: var(--ui-bg);
            border: 3px solid #5a3d1c;
            padding: 8px 15px;
            border-radius: 12px;
            z-index: 10;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .troop-slot {
            width: 60px;
            height: 65px;
            background: #2c1e11;
            border: 2px solid #8e6533;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .troop-slot:active {
            transform: scale(0.95);
        }

        .troop-icon {
            font-size: 24px;
        }

        .troop-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            background: #c0392b;
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* Action Buttons (Attack / Shield) */
        .action-buttons {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .btn-action {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            border: 3px solid #fff;
            color: white;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 2px black;
        }

        .btn-action:hover {
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="resource-box">
            <span class="res-icon">🪙</span>
            <span id="gold-val">1,250,400</span>
        </div>
        <div class="resource-box">
            <span class="res-icon">🧪</span>
            <span id="elixir-val">840,200</span>
        </div>
        <div class="resource-box">
            <span class="res-icon">💎</span>
            <span id="gem-val">524</span>
        </div>
    </div>

    <div class="profile-panel">
        <div class="avatar-container">
            <span class="avatar-img">🧔</span>
            <div class="level-badge">Lv. 24</div>
        </div>
        <div class="player-info">
            <h4>Chief_Max</h4>
            <p>🏆 2,350 Trophies</p>
        </div>
    </div>

    <div class="game-board">
        <div class="village-grid" id="grid">
            </div>
    </div>

    <div class="action-buttons">
        <button class="btn-action" onclick="triggerAttack()">⚔️ Attack!</button>
    </div>

    <div class="bottom-hud">
        <div class="troop-slot" onclick="trainTroop('Barbarian')">
            <div class="troop-icon">👱‍♂️</div>
            <div class="troop-count" id="count-barb">41</div>
        </div>
        <div class="troop-slot" onclick="trainTroop('Archer')">
            <div class="troop-icon">🏹</div>
            <div class="troop-count" id="count-arch">62</div>
        </div>
        <div class="troop-slot" onclick="trainTroop('Giant')">
            <div class="troop-icon">🧌</div>
            <div class="troop-count" id="count-giant">3</div>
        </div>
        <div class="troop-slot" onclick="trainTroop('WallBreaker')">
            <div class="troop-icon">💣</div>
            <div class="troop-count" id="count-wb">1</div>
        </div>
    </div>

    <script>
        // Village Grid setup (8x8 layout mapping specific buildings)
        const gridElement = document.getElementById('grid');
        const totalTiles = 64;

        // Map out predefined iconic locations on the grid
        const initialBuildings = {
            27: { name: 'Town Hall', icon: '🏛️' },
            18: { name: 'Cannon', icon: '💣' },
            22: { name: 'Archer Tower', icon: '🏹' },
            36: { name: 'Gold Mine', icon: '🪙' },
            45: { name: 'Elixir Collector', icon: '🧪' },
            5:  { name: 'Builder Hut', icon: '🛖' },
            54: { name: 'Army Camp', icon: '⛺' }
        };

        function initVillage() {
            gridElement.innerHTML = '';
            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                
                if (initialBuildings[i]) {
                    const b = initialBuildings[i];
                    tile.innerHTML = `
                        <div class="building">${b.icon}</div>
                        <div class="building-label">${b.name}</div>
                    `;
                }
                
                tile.addEventListener('click', () => {
                    if(initialBuildings[i]) {
                        alert(`Clicked ${initialBuildings[i].name}! Upgrade options available.`);
                    } else {
                        alert("Empty plot. Ready to build defenses!");
                    }
                });

                gridElement.appendChild(tile);
            }
        }

        // Troop counts state
        let troops = {
            Barbarian: 41,
            Archer: 62,
            Giant: 3,
            WallBreaker: 1
        };

        function trainTroop(type) {
            troops[type]++;
            if(type === 'Barbarian') document.getElementById('count-barb').innerText = troops[type];
            if(type === 'Archer') document.getElementById('count-arch').innerText = troops[type];
            if(type === 'Giant') document.getElementById('count-giant').innerText = troops[type];
            if(type === 'WallBreaker') document.getElementById('count-wb').innerText = troops[type];
        }

        function triggerAttack() {
            alert("Searching for multiplayer opponent match...");
        }

        // Initialize board on load
        initVillage();
    </script>
</body>
</html>
