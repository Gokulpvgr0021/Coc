<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Royale Ultimate - Mobile Edition</title>
    <!-- Load Babylon.js and GUI library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #hud-overlay {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(4px);
        }
        .hud-panel span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div id="hud-overlay">
        <div class="hud-panel">HP: <span id="health-val">100</span></div>
        <div class="hud-panel">GUN: <span id="weapon-val">AR M4A1</span></div>
        <div class="hud-panel">AMMO: <span id="ammo-val">30</span>/30</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // --- Web Audio API Procedural Sound Engine ---
        class SoundSystem {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }

            playGunshot(type) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                let filter = this.ctx.createBiquadFilter();

                if (type === 'Shotgun') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.9, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                } else if (type === 'Sniper') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                } else { // AR M4A1
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                }

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(900, this.ctx.currentTime);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            playSwitch() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.setValueAtTime(700, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playGlooWall() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sound = new SoundSystem();

        // --- Babylon.js 3D Engine & Scene Initialization ---
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color3(0.02, 0.05, 0.1);

                // Responsive Follow Camera
                const camera = new BABYLON.FollowCamera("FollowCam", new BABYLON.Vector3(0, 10, -15), scene);
                camera.radius = 7.5;
                camera.heightOffset = 2.8;
                camera.rotationOffset = 0;
                camera.cameraAcceleration = 0.08;
                camera.maxCameraSpeed = 15;

                // Lighting & Shadows
                const light = new BABYLON.DirectionalLight("sun", new BABYLON.Vector2(-0.4, -1, 0.4), scene);
                light.position = new BABYLON.Vector3(25, 45, -25);
                light.intensity = 1.9;

                const shadowGenerator = new BABYLON.ShadowGenerator(1024, light);
                shadowGenerator.useBlurExponentialShadowMap = true;
                shadowGenerator.blurKernel = 32;

                const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0, 1, 0), scene);
                ambientLight.intensity = 0.65;
                ambientLight.groundColor = new BABYLON.Color3(0.1, 0.15, 0.2);

                // Terrain Ground
                const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 160, height: 160, subdivisions: 20 }, scene);
                const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
                groundMat.metallic = 0.05;
                groundMat.roughness = 0.85;
                groundMat.albedoColor = new BABYLON.Color3(0.12, 0.2, 0.12);
                ground.material = groundMat;
                ground.receiveShadows = true;

                // Environment Cover Obstacles
                for (let i = 0; i < 15; i++) {
                    let box = BABYLON.MeshBuilder.CreateBox("obstacle" + i, { size: 3.5 }, scene);
                    box.position.x = (Math.random() - 0.5) * 90;
                    box.position.z = (Math.random() - 0.5) * 90;
                    box.position.y = 1.75;
                    
                    let boxMat = new BABYLON.PBRMaterial("boxMat" + i, scene);
                    boxMat.metallic = 0.3;
                    boxMat.roughness = 0.5;
                    boxMat.albedoColor = new BABYLON.Color3(0.25, 0.28, 0.32);
                    box.material = boxMat;
                    shadowGenerator.addShadowCaster(box);
                }

                // Player Character Model
                const player = BABYLON.MeshBuilder.CreateCapsule("player", { radius: 0.55, height: 1.9 }, scene);
                player.position = new BABYLON.Vector3(0, 0.95, 0);
                
                const playerMat = new BABYLON.PBRMaterial("playerMat", scene);
                playerMat.metallic = 0.2;
                playerMat.roughness = 0.4;
                playerMat.albedoColor = new BABYLON.Color3(0.04, 0.2, 0.45); // Tactical Blue Uniform
                player.material = playerMat;
                shadowGenerator.addShadowCaster(player);
                camera.lockedTarget = player;

                // Safe Zone Barrier (Blue Zone)
                const safeZone = BABYLON.MeshBuilder.CreateCylinder("safeZone", { diameter: 110, height: 60, tessellation: 36, sideOrientation: BABYLON.Mesh.BACKSIDE }, scene);
                const zoneMat = new BABYLON.StandardMaterial("zoneMat", scene);
                zoneMat.diffuseColor = new BABYLON.Color3(0, 0.4, 1);
                zoneMat.alpha = 0.12;
                zoneMat.emissiveColor = new BABYLON.Color3(0, 0.25, 0.9);
                safeZone.material = zoneMat;

                // --- Weapon Slots System ---
                const weapons = [
                    { name: "AR M4A1", ammo: 30, maxAmmo: 30, type: "AR" },
                    { name: "M1887 Shotgun", ammo: 8, maxAmmo: 8, type: "Shotgun" },
                    { name: "AWM Sniper", ammo: 5, maxAmmo: 5, type: "Sniper" }
                ];
                let currentWeaponIndex = 0;

                // --- Glow Wall (Gloo Wall) System ---
                let glooWallCount = 3;
                let isPlacingGlooWall = false;
                let previewGlooWall = null;

                function createGlooWallPreview() {
                    if (previewGlooWall) previewGlooWall.dispose();
                    previewGlooWall = BABYLON.MeshBuilder.CreateBox("glooPreview", { width: 3, height: 2.5, depth: 0.8 }, scene);
                    let pMat = new BABYLON.StandardMaterial("glooPMat", scene);
                    pMat.diffuseColor = new BABYLON.Color3(0, 0.8, 1);
                    pMat.alpha = 0.5;
                    previewGlooWall.material = pMat;
                    updateGlooWallPreviewPosition();
                }

                function updateGlooWallPreviewPosition() {
                    if (!previewGlooWall) return;
                    let fwd = player.forward;
                    previewGlooWall.position = player.position.add(fwd.scale(3.5));
                    previewGlooWall.position.y = 1.25;
                    previewGlooWall.rotation.y = player.rotation.y;
                }

                function deployGlooWall() {
                    if (glooWallCount <= 0) return;
                    sound.playGlooWall();
                    let realWall = BABYLON.MeshBuilder.CreateBox("glooWall", { width: 3, height: 2.5, depth: 0.8 }, scene);
                    realWall.position = previewGlooWall.position.clone();
                    realWall.rotation.y = previewGlooWall.rotation.y;

                    let wallMat = new BABYLON.PBRMaterial("glooMat", scene);
                    wallMat.metallic = 0.1;
                    wallMat.roughness = 0.2;
                    wallMat.albedoColor = new BABYLON.Color3(0.0, 0.7, 1.0);
                    wallMat.emissiveColor = new BABYLON.Color3(0.0, 0.3, 0.6);
                    realWall.material = wallMat;
                    shadowGenerator.addShadowCaster(realWall);

                    glooWallCount--;
                    isPlacingGlooWall = false;
                    if (previewGlooWall) {
                        previewGlooWall.dispose();
                        previewGlooWall = null;
                    }
                }

                // --- Babylon GUI Mobile Controls ---
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                // Movement Joystick (Left)
                let moveJoyBase = new BABYLON.GUI.Ellipse("moveBase");
                moveJoyBase.width = "140px";
                moveJoyBase.height = "140px";
                moveJoyBase.left = "40px";
                moveJoyBase.bottom = "40px";
                moveJoyBase.color = "rgba(255, 255, 255, 0.3)";
                moveJoyBase.thickness = 3;
                moveJoyBase.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                moveJoyBase.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
                advancedTexture.addControl(moveJoyBase);

                let moveJoyThumb = new BABYLON.GUI.Ellipse("moveThumb");
                moveJoyThumb.width = "60px";
                moveJoyThumb.height = "60px";
                moveJoyThumb.color = "rgba(56, 189, 248, 0.9)";
                moveJoyThumb.background = "rgba(56, 189, 248, 0.5)";
                moveJoyBase.addControl(moveJoyThumb);

                let isMoving = false;
                let moveTouchId = null;
                let moveVector = new BABYLON.Vector3(0, 0, 0);

                // Robust touch capture handling for left joystick
                moveJoyBase.pointerDownRegistry.add((addInfo) => {
                    isMoving = true;
                    moveTouchId = addInfo.pointerId;
                });

                scene.onPointerObservable.add((pointerInfo) => {
                    if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                        // Check if touch is within left side of screen (joystick area)
                        if (pointerInfo.event.clientX < window.innerWidth / 2 && !isMoving) {
                            isMoving = true;
                            moveTouchId = pointerInfo.event.pointerId;
                        }
                    } else if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERUP) {
                        if (pointerInfo.event.pointerId === moveTouchId) {
                            isMoving = false;
                            moveTouchId = null;
                            moveJoyThumb.left = 0;
                            moveJoyThumb.top = 0;
                            moveVector.set(0, 0, 0);
                        }
                    } else if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERMOVE) {
                        if (isMoving && pointerInfo.event.pointerId === moveTouchId) {
                            let rect = moveJoyBase._domElement ? moveJoyBase._domElement.getBoundingClientRect() : { left: 40, top: window.innerHeight - 180, width: 140, height: 140 };
                            let centerX = rect.left + rect.width / 2;
                            let centerY = rect.top + rect.height / 2;
                            let dx = pointerInfo.event.clientX - centerX;
                            let dy = pointerInfo.event.clientY - centerY;
                            let dist = Math.sqrt(dx * dx + dy * dy);
                            let maxDist = 45;

                            if (dist > maxDist) {
                                dx = (dx / dist) * maxDist;
                                dy = (dy / dist) * maxDist;
                            }
                            moveJoyThumb.left = dx + "px";
                            moveJoyThumb.top = dy + "px";
                            moveVector.x = dx / maxDist;
                            moveVector.z = -dy / maxDist;
                        }
                    }
                });

                // Right Action Buttons Panel
                // 1. Fire Button
                let fireButton = BABYLON.GUI.Button.CreateSimpleButton("fireBtn", "FIRE");
                fireButton.width = "85px";
                fireButton.height = "85px";
                fireButton.color = "white";
                fireButton.background = "rgba(239, 68, 68, 0.85)";
                fireButton.cornerRadius = 42;
                fireButton.thickness = 3;
                fireButton.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                fireButton.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
                fireButton.left = "-30px";
                fireButton.bottom = "-30px";
                advancedTexture.addControl(fireButton);

                fireButton.onPointerUpObservable.add(() => {
                    if (isPlacingGlooWall) {
                        deployGlooWall();
                        return;
                    }

                    let curW = weapons[currentWeaponIndex];
                    if (curW.ammo > 0) {
                        curW.ammo--;
                        document.getElementById("ammo-val").innerText = curW.ammo;
                        sound.playGunshot(curW.type);

                        player.scaling.z = 1.12;
                        setTimeout(() => player.scaling.z = 1, 70);
                    } else {
                        sound.playSwitch();
                        curW.ammo = curW.maxAmmo;
                        document.getElementById("ammo-val").innerText = curW.ammo;
                    }
                });

                // 2. Weapon Slot Switcher Button
                let slotButton = BABYLON.GUI.Button.CreateSimpleButton("slotBtn", "SWAP GUN");
                slotButton.width = "75px";
                slotButton.height = "45px";
                slotButton.color = "white";
                slotButton.background = "rgba(15, 23, 42, 0.85)";
                slotButton.cornerRadius = 8;
                slotButton.thickness = 2;
                slotButton.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                slotButton.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
                slotButton.left = "-130px";
                slotButton.bottom = "-45px";
                advancedTexture.addControl(slotButton);

                slotButton.onPointerUpObservable.add(() => {
                    if (isPlacingGlooWall) {
                        isPlacingGlooWall = false;
                        if (previewGlooWall) { previewGlooWall.dispose(); previewGlooWall = null; }
                    }
                    currentWeaponIndex = (currentWeaponIndex + 1) % weapons.length;
                    let curW = weapons[currentWeaponIndex];
                    document.getElementById("weapon-val").innerText = curW.name;
                    document.getElementById("ammo-val").innerText = curW.ammo;
                    sound.playSwitch();
                });

                // 3. Glow Wall (Gloo Wall) Button
                let glooButton = BABYLON.GUI.Button.CreateSimpleButton("glooBtn", "GLOW WALL");
                glooButton.width = "75px";
                glooButton.height = "45px";
                glooButton.color = "white";
                glooButton.background = "rgba(2, 132, 199, 0.85)";
                glooButton.cornerRadius = 8;
                glooButton.thickness = 2;
                glooButton.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                glooButton.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
                glooButton.left = "-130px";
                glooButton.bottom = "-105px";
                advancedTexture.addControl(glooButton);

                glooButton.onPointerUpObservable.add(() => {
                    if (glooWallCount > 0) {
                        isPlacingGlooWall = !isPlacingGlooWall;
                        if (isPlacingGlooWall) {
                            createGlooWallPreview();
                        } else if (previewGlooWall) {
                            previewGlooWall.dispose();
                            previewGlooWall = null;
                        }
                    }
                });

                // Main Render Loop
                scene.registerBeforeRender(() => {
                    if (moveVector.length() > 0) {
                        let speed = 0.12;
                        let moveDir = new BABYLON.Vector3(moveVector.x, 0, moveVector.z);
                        player.moveWithCollisions(moveDir.scale(speed));
                        
                        let targetAngle = Math.atan2(moveVector.x, moveVector.z);
                        player.rotation.y = targetAngle;

                        if (isPlacingGlooWall) {
                            updateGlooWallPreviewPosition();
                        }
                    }

                    if (safeZone.scaling.x > 0.35) {
                        safeZone.scaling.x -= 0.00008;
                        safeZone.scaling.z -= 0.00008;
                    }
                });

                return scene;
            };

            const scene = createScene();
            engine.runRenderLoop(() => { scene.render(); });
            window.addEventListener("resize", () => { engine.resize(); });
        });
    </script>
</body>
</html>
