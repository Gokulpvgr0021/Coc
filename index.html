<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Red Ball Classic - Multi-Levels</title>
    <!-- Babylon.js & GUI Library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1b4b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        #hud-overlay {
            position: absolute;
            top: env(safe-area-inset-top, 10px);
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-panel {
            background: rgba(30, 27, 75, 0.9);
            border: 2px solid rgba(234, 179, 8, 0.8);
            padding: 6px 14px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
            backdrop-filter: blur(6px);
            pointer-events: auto;
        }
        .hud-panel span {
            color: #facc15;
        }
        #download-btn {
            background: linear-gradient(135deg, #ca8a04, #eab308);
            color: #1e1b4b;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="hud-overlay">
        <div class="hud-panel">LEVEL: <span id="level-val">1</span> / 5</div>
        <div class="hud-panel">STARS: <span id="stars-val">0</span> / 3</div>
        <button id="download-btn" onclick="triggerAppDownload()">📲 DOWNLOAD APP</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        function triggerAppDownload() {
            alert("App Installer Package initialized! Adding Red Ball Classic shortcut to your home screen.");
            const appBlob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(appBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'RedBallClassic.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // --- Web Audio Retro Sound Synthesizer ---
        class SoundSystem {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            }
            playJump() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playCollect() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.setValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playWin() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.setValueAtTime(500, this.ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(700, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
        }
        const sound = new SoundSystem();

        // --- Babylon.js 3D Red Ball Game Engine ---
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

            let currentLevel = 1;
            let starsCollected = 0;
            const maxLevels = 5;

            const createScene = function () {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92); // Sky Blue Background

                // Side-scroller camera setup (Classic Red Ball view)
                const camera = new BABYLON.ArcRotateCamera("Camera", -Math.PI / 2, Math.PI / 2.3, 18, BABYLON.Vector3.Zero(), scene);
                camera.attachControl(canvas, false);

                const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
                light.intensity = 1.2;

                const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector2(-1, -2), scene);
                dirLight.position = new BABYLON.Vector3(10, 20, -10);
                dirLight.intensity = 0.8;

                // --- Level Designs ---
                let platforms = [];
                let stars = [];
                let goalFlag = null;

                function buildLevel(levelNum) {
                    // Clear previous level elements
                    platforms.forEach(p => p.dispose());
                    stars.forEach(s => s.dispose());
                    if (goalFlag) goalFlag.dispose();
                    platforms = []; stars = [];

                    let pathLength = 30 + (levelNum * 10);

                    // Ground Path
                    for (let i = 0; i < pathLength; i += 6) {
                        let ground = BABYLON.MeshBuilder.CreateBox("ground" + i, { width: 6, height: 1, depth: 4 }, scene);
                        ground.position = new BABYLON.Vector3(i, -1, 0);
                        let mat = new BABYLON.StandardMaterial("gMat", scene);
                        mat.diffuseColor = (i % 12 === 0) ? new BABYLON.Color3(0.1, 0.6, 0.2) : new BABYLON.Color3(0.15, 0.7, 0.25);
                        ground.material = mat;
                        platforms.push(ground);
                    }

                    // Add Level-specific Obstacles & Platforms
                    if (levelNum >= 2) {
                        let plat1 = BABYLON.MeshBuilder.CreateBox("p1", { width: 4, height: 0.8, depth: 3 }, scene);
                        plat1.position = new BABYLON.Vector3(12, 2, 0);
                        let pm = new BABYLON.StandardMaterial("pm", scene); pm.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.1);
                        plat1.material = pm; platforms.push(plat1);
                    }
                    if (levelNum >= 3) {
                        let plat2 = BABYLON.MeshBuilder.CreateBox("p2", { width: 4, height: 0.8, depth: 3 }, scene);
                        plat2.position = new BABYLON.Vector3(22, 3.5, 0);
                        let pm2 = new BABYLON.StandardMaterial("pm2", scene); pm2.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.1);
                        plat2.material = pm2; platforms.push(plat2);
                    }
                    if (levelNum >= 4) {
                        let plat3 = BABYLON.MeshBuilder.CreateBox("p3", { width: 5, height: 0.8, depth: 3 }, scene);
                        plat3.position = new BABYLON.Vector3(32, 2.5, 0);
                        let pm3 = new BABYLON.StandardMaterial("pm3", scene); pm3.diffuseColor = new BABYLON.Color3(0.8, 0.3, 0.1);
                        plat3.material = pm3; platforms.push(plat3);
                    }

                    // Stars to Collect
                    let starPositions = [
                        new BABYLON.Vector3(12, 3.5, 0),
                        new BABYLON.Vector3(22, 5, 0),
                        new BABYLON.Vector3(pathLength - 8, 2, 0)
                    ];

                    starPositions.forEach((pos, idx) => {
                        let star = BABYLON.MeshBuilder.CreateSphere("star" + idx, { diameter: 0.8 }, scene);
                        star.position = pos;
                        let sm = new BABYLON.StandardMaterial("sMat", scene);
                        sm.emissiveColor = new BABYLON.Color3(1, 0.8, 0);
                        star.material = sm;
                        stars.push(star);
                    });

                    // Goal Flag
                    goalFlag = BABYLON.MeshBuilder.CreateBox("goal", { width: 0.5, height: 4, depth: 0.5 }, scene);
                    goalFlag.position = new BABYLON.Vector3(pathLength - 2, 1.5, 0);
                    let fm = new BABYLON.StandardMaterial("fMat", scene);
                    fm.emissiveColor = new BABYLON.Color3(1, 0, 0);
                    goalFlag.material = fm;

                    document.getElementById("level-val").innerText = levelNum;
                }

                // --- Red Ball Character ---
                const ball = BABYLON.MeshBuilder.CreateSphere("redBall", { diameter: 1.2 }, scene);
                ball.position = new BABYLON.Vector3(0, 1, 0);
                const ballMat = new BABYLON.StandardMaterial("bMat", scene);
                ballMat.diffuseColor = new BABYLON.Color3(0.95, 0.1, 0.1); // Classic Bright Red
                ballMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                ball.material = ballMat;

                // Ball face eyes
                let eyeL = BABYLON.MeshBuilder.CreateSphere("eyeL", { diameter: 0.25 }, scene);
                eyeL.position = new BABYLON.Vector3(-0.25, 0.25, 0.5);
                eyeL.parent = ball;
                let eyeR = BABYLON.MeshBuilder.CreateSphere("eyeR", { diameter: 0.25 }, scene);
                eyeR.position = new BABYLON.Vector3(0.25, 0.25, 0.5);
                eyeR.parent = ball;
                let pupilMat = new BABYLON.StandardMaterial("pMat", scene); pupilMat.diffuseColor = new BABYLON.Color3(0,0,0);
                eyeL.material = pupilMat; eyeR.material = pupilMat;

                buildLevel(currentLevel);

                // --- Movement State & Physics ---
                let moveDir = 0; // -1 left, 1 right
                let velocityY = 0;
                let isGrounded = false;

                // --- Touch GUI Controls ---
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                // Left & Right Roll Buttons
                let btnLeft = BABYLON.GUI.Button.CreateSimpleButton("btnL", "◀");
                btnLeft.width = "75px"; btnLeft.height = "75px"; btnLeft.color = "white"; btnLeft.background = "rgba(234, 179, 8, 0.7)";
                btnLeft.cornerRadius = 37; btnLeft.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnLeft.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnLeft.left = "30px"; btnLeft.bottom = "30px";
                advancedTexture.addControl(btnLeft);

                let btnRight = BABYLON.GUI.Button.CreateSimpleButton("btnR", "▶");
                btnRight.width = "75px"; btnRight.height = "75px"; btnRight.color = "white"; btnRight.background = "rgba(234, 179, 8, 0.7)";
                btnRight.cornerRadius = 37; btnRight.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
                btnRight.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnRight.left = "125px"; btnRight.bottom = "30px";
                advancedTexture.addControl(btnRight);

                // Jump Button
                let btnJump = BABYLON.GUI.Button.CreateSimpleButton("btnJ", "JUMP");
                btnJump.width = "90px"; btnJump.height = "90px"; btnJump.color = "white"; btnJump.background = "rgba(239, 68, 68, 0.85)";
                btnJump.cornerRadius = 45; btnJump.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT;
                btnJump.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM; btnJump.right = "30px"; btnJump.bottom = "30px";
                advancedTexture.addControl(btnJump);

                btnLeft.onPointerDownObservable.add(() => { moveDir = -1; });
                btnLeft.onPointerUpObservable.add(() => { if (moveDir === -1) moveDir = 0; });
                btnRight.onPointerDownObservable.add(() => { moveDir = 1; });
                btnRight.onPointerUpObservable.add(() => { if (moveDir === 1) moveDir = 0; });

                btnJump.onPointerUpObservable.add(() => {
                    if (isGrounded) {
                        velocityY = 0.22;
                        isGrounded = false;
                        sound.playJump();
                    }
                });

                // Keyboard support for desktop testing
                window.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowLeft" || e.key === "a") moveDir = -1;
                    if (e.key === "ArrowRight" || e.key === "d") moveDir = 1;
                    if ((e.key === " " || e.key === "ArrowUp") && isGrounded) {
                        velocityY = 0.22; isGrounded = false; sound.playJump();
                    }
                });
                window.addEventListener("keyup", (e) => {
                    if ((e.key === "ArrowLeft" || e.key === "a") && moveDir === -1) moveDir = 0;
                    if ((e.key === "ArrowRight" || e.key === "d") && moveDir === 1) moveDir = 0;
                });

                // --- Main Game Loop ---
                scene.registerBeforeRender(() => {
                    // Horizontal rolling movement
                    if (moveDir !== 0) {
                        ball.position.x += moveDir * 0.12;
                        ball.rotation.z -= moveDir * 0.15; // Roll effect
                    }

                    // Gravity & Vertical physics
                    velocityY -= 0.012;
                    ball.position.y += velocityY;

                    // Platform Collision check
                    isGrounded = false;
                    platforms.forEach(p => {
                        let pBox = p.getBoundingInfo().boundingBox;
                        if (ball.position.x >= pBox.minimumWorld.x && ball.position.x <= pBox.maximumWorld.x &&
                            ball.position.z >= pBox.minimumWorld.z && ball.position.z <= pBox.maximumWorld.z) {
                            let surfaceY = pBox.maximumWorld.y + 0.6;
                            if (ball.position.y <= surfaceY && ball.position.y >= surfaceY - 0.4 && velocityY <= 0) {
                                ball.position.y = surfaceY;
                                velocityY = 0;
                                isGrounded = true;
                            }
                        }
                    });

                    // Fall off stage reset
                    if (ball.position.y < -5) {
                        ball.position = new BABYLON.Vector3(0, 3, 0);
                        velocityY = 0;
                    }

                    // Camera follow red ball smoothly
                    camera.target = new BABYLON.Vector3(ball.position.x, ball.position.y, 0);

                    // Star Collection check
                    stars.forEach((star, idx) => {
                        if (star && BABYLON.Vector3.Distance(ball.position, star.position) < 1.2) {
                            star.dispose();
                            stars[idx] = null;
                            starsCollected++;
                            document.getElementById("stars-val").innerText = starsCollected;
                            sound.playCollect();
                        }
                    });

                    // Goal Flag check (Next Level)
                    if (goalFlag && BABYLON.Vector3.Distance(ball.position, goalFlag.position) < 1.5) {
                        sound.playWin();
                        currentLevel++;
                        if (currentLevel > maxLevels) {
                            alert("🎉 Congratulations! You beat all levels of Red Ball Classic!");
                            currentLevel = 1;
                            starsCollected = 0;
                            document.getElementById("stars-val").innerText = starsCollected;
                        } else {
                            alert("Level Cleared! Advancing to Level " + currentLevel);
                        }
                        ball.position = new BABYLON.Vector3(0, 3, 0);
                        buildLevel(currentLevel);
                    }
                });

                return scene;
            };

            const scene = createScene();
            engine.runRenderLoop(() => { scene.render(); });
            window.addEventListener("resize", () => { engine.resize(); });
        });
    </script>
</body>
</html>
