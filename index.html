<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Realistic Match-3 Candy Game</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #4a0e4e 0%, #1a0524 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #ffcc00;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }

        /* Top HUD Score & Moves Panel */
        .hud {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .hud span {
            color: #ff99ff;
        }

        /* Game Board Container (8x8 Grid) */
        .board-container {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 16px;
            border: 4px solid #ff66b2;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 44px);
            grid-template-rows: repeat(8, 44px);
            gap: 4px;
        }

        /* Candy Tile Styling */
        .candy {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3);
        }

        .candy:hover {
            transform: scale(1.08);
        }

        .candy.selected {
            border: 3px solid #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 15px #ffffff;
        }

        /* Game Over / Win Modal */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 5, 36, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
            border-radius: 12px;
        }

        .modal h2 {
            color: #ff3399;
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 51, 153, 0.7);
        }
        
        .btn-restart {
            background: linear-gradient(to bottom, #ff3399, #cc0066);
            border: 2px solid #ff99ff;
            color: white;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 6px 15px rgba(204, 0, 102, 0.5);
        }
        .btn-restart:hover { filter: brightness(1.1); }

        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #cc99ff;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Candy Crush Saga Lite</h1>

    <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Moves Left: <span id="moves">25</span></div>
    </div>

    <div class="board-container">
        <div class="grid" id="grid"></div>

        <!-- Modal Screen -->
        <div class="modal" id="modal">
            <h2 id="modal-title">Game Over</h2>
            <p>Final Score: <span id="final-score" style="color: #ffcc00; font-weight: bold;">0</span></p>
            <button class="btn-restart" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <div class="hint">
        Click two adjacent candies to swap them and match 3 or more!
    </div>

    <script>
        const width = 8;
        const candies = ['🔴', '🔵', '🟢', '🟡', '🟣', '🟠']; // Candies representation
        let board = [];
        let score = 0;
        let moves = 25;
        let selectedIndex = null;
        let isProcessing = false;

        const gridElement = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const movesDisplay = document.getElementById('moves');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const finalScoreDisplay = document.getElementById('final-score');

        function initGame() {
            score = 0;
            moves = 25;
            isProcessing = false;
            modal.style.display = 'none';
            scoreDisplay.innerText = score;
            movesDisplay.innerText = moves;

            do {
                board = [];
                for (let i = 0; i < width * width; i++) {
                    board.push(candies[Math.floor(Math.random() * candies.length)]);
                }
            } while (checkInitialMatches()); // Ensure no initial matches at start

            renderBoard();
        }

        function checkInitialMatches() {
            // Check row or col for preset matches
            for (let i = 0; i < 64; i++) {
                let row = Math.floor(i / width);
                let col = i % width;
                if (col < 6 && board[i] === board[i+1] && board[i] === board[i+2]) return true;
                if (row < 6 && board[i] === board[i+width] && board[i] === board[i+width*2]) return true;
            }
            return false;
        }

        function renderBoard() {
            gridElement.innerHTML = '';
            board.forEach((candy, index) => {
                const cell = document.createElement('div');
                cell.classList.add('candy');
                cell.innerText = candy;
                cell.dataset.index = index;
                if (selectedIndex === index) {
                    cell.classList.add('selected');
                }
                cell.addEventListener('click', () => handleCellClick(index));
                gridElement.appendChild(cell);
            });
        }

        function handleCellClick(index) {
            if (isProcessing || moves <= 0) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                renderBoard();
            } else {
                let firstIndex = selectedIndex;
                selectedIndex = null;

                if (isAdjacent(firstIndex, index)) {
                    swapCandies(firstIndex, index);
                    
                    // Check if swap produces a match
                    let matched = checkMatches();
                    if (matched) {
                        moves--;
                        movesDisplay.innerText = moves;
                        processMatches();
                    } else {
                        // Swap back if no match found (illegal move)
                        swapCandies(firstIndex, index);
                        renderBoard();
                    }
                } else {
                    renderBoard();
                }

                checkGameOver();
            }
        }

        function isAdjacent(i1, i2) {
            let r1 = Math.floor(i1 / width), c1 = i1 % width;
            let r2 = Math.floor(i2 / width), c2 = i2 % width;
            return (Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1);
        }

        function swapCandies(i1, i2) {
            let temp = board[i1];
            board[i1] = board[i2];
            board[i2] = temp;
            renderBoard();
        }

        function checkMatches() {
            let matchFound = false;
            // We only need to return boolean for quick verification
            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    if (board[idx] && board[idx] === board[idx+1] && board[idx] === board[idx+2]) return true;
                }
            }
            for (let r = 0; r < width - 2; r++) {
                for (let c = 0; c < width; c++) {
                    let idx = r * width + c;
                    if (board[idx] && board[idx] === board[idx+width] && board[idx] === board[idx+width*2]) return true;
                }
            }
            return false;
        }

        function processMatches() {
            isProcessing = true;
            let clearedIndices = new Set();

            // Find horizontal matches
            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    let val = board[idx];
                    if (val && val === board[idx+1] && val === board[idx+2]) {
                        clearedIndices.add(idx);
                        clearedIndices.add(idx+1);
                        clearedIndices.add(idx+2);
                    }
                }
            }

            // Find vertical matches
            for (let r = 0; r < width - 2; r++) {
                for (let c = 0; c < width; c++) {
                    let idx = r * width + c;
                    let val = board[idx];
                    if (val && val === board[idx+width] && val === board[idx+width*2]) {
                        clearedIndices.add(idx);
                        clearedIndices.add(idx+width);
                        clearedIndices.add(idx+width*2);
                    }
                }
            }

            if (clearedIndices.size > 0) {
                score += clearedIndices.size * 10;
                scoreDisplay.innerText = score;

                clearedIndices.forEach(idx => board[idx] = null);
                renderBoard();

                setTimeout(() => {
                    applyGravity();
                }, 300);
            } else {
                isProcessing = false;
            }
        }

        function applyGravity() {
            // Drop existing candies down
            for (let c = 0; c < width; c++) {
                for (let r = width - 1; r >= 0; r--) {
                    let idx = r * width + c;
                    if (board[idx] === null) {
                        // Look up for the first available candy
                        let found = false;
                        for (let aboveR = r - 1; aboveR >= 0; aboveR--) {
                            let aboveIdx = aboveR * width + c;
                            if (board[aboveIdx] !== null) {
                                board[idx] = board[aboveIdx];
                                board[aboveIdx] = null;
                                found = true;
                                break;
                            }
                        }
                        // If none found above, generate a new candy at top
                        if (!found) {
                            board[idx] = candies[Math.floor(Math.random() * candies.length)];
                        }
                    }
                }
            }

            renderBoard();

            // Check if cascading matches occurred
            setTimeout(() => {
                if (checkMatches()) {
                    processMatches();
                } else {
                    isProcessing = false;
                }
            }, 300);
        }

        function checkGameOver() {
            if (moves <= 0) {
                setTimeout(() => {
                    modalTitle.innerText = "Out of Moves!";
                    finalScoreDisplay.innerText = score;
                    modal.style.display = 'flex';
                }, 400);
            }
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
