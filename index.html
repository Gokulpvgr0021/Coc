<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mixed Emoji Blast - World's Newest Game</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: white;
            user-select: none;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        }

        header {
            text-align: center;
            padding-top: 10px;
        }

        h1 {
            color: #38bdf8;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .hud {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 12px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            margin-top: 5px;
        }

        .hud span {
            color: #f43f5e;
        }

        .board-container {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px;
            border-radius: 16px;
            border: 4px solid #38bdf8;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 11vw);
            grid-template-rows: repeat(8, 11vw);
            max-width: 380px;
            max-height: 380px;
            gap: 3px;
        }

        @media (min-width: 450px) {
            .grid {
                grid-template-columns: repeat(8, 44px);
                grid-template-rows: repeat(8, 44px);
            }
        }

        .tile {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 3px 6px rgba(0,0,0,0.3);
        }

        .tile.dragging {
            transform: scale(1.25);
            z-index: 10;
            filter: brightness(1.3);
            background: rgba(56, 189, 248, 0.3);
        }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            text-align: center;
            padding: 20px;
        }

        .modal h2 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
        }

        .modal p {
            font-size: 15px;
            margin: 4px 0;
            color: #f43f5e;
        }
        
        .btn-action {
            background: linear-gradient(to bottom, #0ea5e9, #0284c7);
            border: 2px solid #bae6fd;
            color: white;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 6px 15px rgba(14, 165, 233, 0.5);
        }
        .btn-action:hover { filter: brightness(1.1); }

        footer {
            padding-bottom: 15px;
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Emoji Blast</h1>
        <div class="hud">
            <div>Level: <span id="level-display">1</span></div>
            <div>Score: <span id="score">0</span>/<span id="target-score">300</span></div>
            <div>Moves: <span id="moves">22</span></div>
        </div>
    </header>

    <div class="board-container">
        <div class="grid" id="grid"></div>

        <div class="modal" id="modal">
            <h2 id="modal-title">Level Cleared!</h2>
            <p id="modal-text">Amazing moves! Ready for the next challenge?</p>
            <button class="btn-action" id="modal-btn" onclick="nextLevel()">Next Level</button>
        </div>
    </div>

    <footer>
        Swipe/Drag emojis to match 3 or more & score points!
    </footer>

    <script>
        const width = 8;
        const emojis = ['🔥', '⭐', '💎', '🚀', '⚡', '🍀'];
        
        let level = 1;
        let score = 0;
        let targetScore = 300;
        let moves = 22;
        let board = [];
        let isProcessing = false;

        let touchStartIndex = null;
        let startX = 0;
        let startY = 0;

        const gridElement = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const targetDisplay = document.getElementById('target-score');
        const movesDisplay = document.getElementById('moves');
        const levelDisplay = document.getElementById('level-display');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalBtn = document.getElementById('modal-btn');

        function initGame() {
            score = 0;
            moves = Math.max(15, 24 - (level * 2));
            targetScore = level * 350;
            isProcessing = false;
            modal.style.display = 'none';

            scoreDisplay.innerText = score;
            targetDisplay.innerText = targetScore;
            movesDisplay.innerText = moves;
            levelDisplay.innerText = level;

            do {
                board = [];
                for (let i = 0; i < width * width; i++) {
                    board.push(emojis[Math.floor(Math.random() * emojis.length)]);
                }
            } while (checkInitialMatches());

            renderBoard();
        }

        function checkInitialMatches() {
            for (let i = 0; i < 64; i++) {
                let row = Math.floor(i / width);
                let col = i % width;
                if (col < 6 && board[i] === board[i+1] && board[i] === board[i+2]) return true;
                if (row < 6 && board[i] === board[i+width] && board[i] === board[i+width*2]) return true;
            }
            return false;
        }

        function renderBoard() {
            gridElement.innerHTML = '';
            board.forEach((emoji, index) => {
                const cell = document.createElement('div');
                cell.classList.add('tile');
                cell.innerText = emoji;
                cell.dataset.index = index;

                cell.addEventListener('pointerdown', (e) => handlePointerDown(e, index));
                gridElement.appendChild(cell);
            });
        }

        function handlePointerDown(e, index) {
            if (isProcessing || moves <= 0) return;
            touchStartIndex = index;
            startX = e.clientX;
            startY = e.clientY;

            let targetCell = gridElement.children[index];
            if (targetCell) targetCell.classList.add('dragging');

            window.addEventListener('pointerup', handlePointerUp, { once: true });
        }

        function handlePointerUp(e) {
            if (touchStartIndex === null) return;

            let endX = e.clientX;
            let endY = e.clientY;
            let diffX = endX - startX;
            let diffY = endY - startY;

            let targetIndex = null;
            let threshold = 15;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > threshold && touchStartIndex % width < width - 1) {
                    targetIndex = touchStartIndex + 1;
                } else if (diffX < -threshold && touchStartIndex % width > 0) {
                    targetIndex = touchStartIndex - 1;
                }
            } else {
                if (diffY > threshold && touchStartIndex < width * (width - 1)) {
                    targetIndex = touchStartIndex + width;
                } else if (diffY < -threshold && touchStartIndex >= width) {
                    targetIndex = touchStartIndex - width;
                }
            }

            let oldCell = gridElement.children[touchStartIndex];
            if (oldCell) oldCell.classList.remove('dragging');

            if (targetIndex !== null) {
                executeSwipe(touchStartIndex, targetIndex);
            }

            touchStartIndex = null;
        }

        function executeSwipe(i1, i2) {
            isProcessing = true;
            swapTiles(i1, i2);

            let matched = checkMatches();
            if (matched) {
                moves--;
                movesDisplay.innerText = moves;
                processMatches();
            } else {
                setTimeout(() => {
                    swapTiles(i1, i2);
                    isProcessing = false;
                }, 150);
            }

            checkGameProgress();
        }

        function swapTiles(i1, i2) {
            let temp = board[i1];
            board[i1] = board[i2];
            board[i2] = temp;
            renderBoard();
        }

        function checkMatches() {
            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    if (board[idx] && board[idx] === board[idx+1] && board[idx] === board[idx+2]) return true;
                }
            }
            for (let r = 0; r < width - 2; r++) {
                for (let c = 0; c < width; c++) {
                    let idx = r * width + c;
                    if (board[idx] && board[idx] === board[idx+width] && board[idx] === board[idx+width*2]) return true;
                }
            }
            return false;
        }

        function processMatches() {
            let clearedIndices = new Set();

            for (let r = 0; r < width; r++) {
                for (let c = 0; c < width - 2; c++) {
                    let idx = r * width + c;
                    let val = board[idx];
                    if (val && val === board[idx+1] && val === board[idx+2]) {
                        clearedIndices.add(idx);
                        clearedIndices.add(idx+1);
                        clearedIndices.add(idx+2);
                    }
                }
            }

            for (let r = 0; r < width - 2; r++) {
                for (let c = 0; c < width; c++) {
                    let idx = r * width + c;
                    let val = board[idx];
                    if (val && val === board[idx+width] && val === board[idx+width*2]) {
                        clearedIndices.add(idx);
                        clearedIndices.add(idx+width);
                        clearedIndices.add(idx+width*2);
                    }
                }
            }

            if (clearedIndices.size > 0) {
                score += clearedIndices.size * 15;
                scoreDisplay.innerText = score;

                clearedIndices.forEach(idx => board[idx] = null);
                renderBoard();

                setTimeout(() => {
                    applyGravity();
                }, 250);
            } else {
                isProcessing = false;
                checkGameProgress();
            }
        }

        function applyGravity() {
            for (let c = 0; c < width; c++) {
                for (let r = width - 1; r >= 0; r--) {
                    let idx = r * width + c;
                    if (board[idx] === null) {
                        let found = false;
                        for (let aboveR = r - 1; aboveR >= 0; aboveR--) {
                            let aboveIdx = aboveR * width + c;
                            if (board[aboveIdx] !== null) {
                                board[idx] = board[aboveIdx];
                                board[aboveIdx] = null;
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            board[idx] = emojis[Math.floor(Math.random() * emojis.length)];
                        }
                    }
                }
            }

            renderBoard();

            setTimeout(() => {
                if (checkMatches()) {
                    processMatches();
                } else {
                    isProcessing = false;
                    checkGameProgress();
                }
            }, 250);
        }

        function checkGameProgress() {
            if (score >= targetScore) {
                setTimeout(() => {
                    modalTitle.innerText = "Level Cleared! 🚀";
                    modalText.innerText = `Awesome! You reached the score target.`;
                    modalBtn.innerText = "Next Level";
                    modalBtn.onclick = nextLevel;
                    modal.style.display = 'flex';
                }, 300);
            } else if (moves <= 0 && !isProcessing) {
                setTimeout(() => {
                    modalTitle.innerText = "Out of Moves! 😢";
                    modalText.innerText = `Score: ${score}. Target was ${targetScore}.`;
                    modalBtn.innerText = "Try Again";
                    modalBtn.onclick = restartLevel;
                    modal.style.display = 'flex';
                }, 300);
            }
        }

        function nextLevel() {
            level++;
            initGame();
        }

        function restartLevel() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
